<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心 - 漢堡王 Burger King</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f4f6f8 0%, #e0e8f0 100%); 
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar { background: #B0E0E6; padding: 10px 20px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .navbar-brand { font-size: 1.5rem; font-weight: bold; color: #2F4F4F; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .navbar-brand img { width: 40px; height: 40px; }
        
        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            flex-grow: 1;
        }

        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-icon { font-size: 4rem; color: #4682B4; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: 600; color: #2F4F4F; }
        .form-control { border-radius: 10px; padding: 12px; background: #f4f6f8; border: 1px solid #dee2e6; }
        .form-control:focus { border-color: #4682B4; box-shadow: 0 0 0 0.25rem rgba(70, 130, 180, 0.2); background: #ffffff; }

        .btn-gradient { background: linear-gradient(135deg, #5DADE2 0%, #4682B4 100%); border: none; color: white; padding: 12px; font-weight: 700; border-radius: 50px; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(93, 173, 226, 0.3); color: white; }
    
    /* --- BURGER KING PREMIUM DESIGN SYSTEM OVERRIDE --- */
    :root {
        --bk-red: #D62300;
        --bk-orange: #F2A900;
        --bk-dark: #3C2415;
        --bk-cream: #F7EFE9;
        --bk-brown: #502C1E;
        --text-light: #F7EFE9;
        --text-muted-light: #c1a89c;
    }
    
    /* Global Color System */
    body {
        background: linear-gradient(135deg, #1b0c07 0%, #0d0604 100%) !important;
        color: var(--text-light) !important;
    }
    
    .navbar, .navbar-custom {
        background: var(--bk-dark) !important;
        border-bottom: 3px solid var(--bk-red) !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }
    
    .navbar-logo, .navbar-logo span, .navbar-brand {
        color: var(--bk-orange) !important;
        font-family: 'Outfit', 'Noto Sans TC', sans-serif !important;
    }
    
    .navbar-menu a {
        color: var(--text-light) !important;
    }
    
    .navbar-menu a:hover {
        color: var(--bk-orange) !important;
    }
    
    .navbar-toggle {
        color: var(--bk-orange) !important;
    }
    
    /* Menu / Home / Section Styles */
    .menu-section {
        background: #170d0a !important;
    }
    
    .menu-section:nth-of-type(even) {
        background: #110806 !important;
    }
    
    .menu-title {
        color: var(--text-light) !important;
        border-bottom-color: var(--bk-red) !important;
        font-family: 'Outfit', 'Noto Sans TC', sans-serif !important;
    }
    
    .menu-subtitle {
        color: var(--text-muted-light) !important;
    }
    
    .menu-item {
        background: #251610 !important;
        border: 1px solid rgba(242, 169, 0, 0.15) !important;
        color: var(--text-light) !important;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3) !important;
    }
    
    .menu-item-name {
        color: var(--text-light) !important;
    }
    
    .menu-item-price {
        color: var(--bk-orange) !important;
    }
    
    .menu-button.buy {
        background: linear-gradient(135deg, var(--bk-red) 0%, #ff6f00 100%) !important;
        border: none !important;
        color: white !important;
    }
    
    .menu-button.buy:hover {
        background: linear-gradient(135deg, #b31c00 0%, #e65100 100%) !important;
        transform: translateY(-2px) !important;
    }
    
    .menu-button.learn-more {
        background: transparent !important;
        color: var(--bk-orange) !important;
        border-color: var(--bk-orange) !important;
    }
    
    .menu-button.learn-more:hover {
        background: rgba(242, 169, 0, 0.1) !important;
        color: white !important;
        border-color: white !important;
    }
    
    /* Footer Overrides */
    .footer {
        background: linear-gradient(135deg, #251610 0%, #170d0a 100%) !important;
        border-top: 3px solid var(--bk-red) !important;
        color: var(--text-muted-light) !important;
    }
    
    .footer::before {
        display: none !important;
    }
    
    .footer-section h3 {
        color: var(--bk-orange) !important;
    }
    
    .footer-section h3::after {
        background: var(--bk-red) !important;
    }
    
    .footer-section p, .footer-section ul li, .footer-section ul li a {
        color: var(--text-muted-light) !important;
    }
    
    .footer-section ul li:hover, .footer-section ul li a:hover {
        color: var(--bk-orange) !important;
    }
    
    .social-links a {
        background: rgba(242, 169, 0, 0.1) !important;
        color: var(--bk-orange) !important;
    }
    
    .social-links a:hover {
        background: linear-gradient(135deg, var(--bk-red) 0%, var(--bk-orange) 100%) !important;
        color: white !important;
        transform: translateY(-2px) !important;
    }
    
    /* Product Detail page */
    .product-detail-container {
        background: #251610 !important;
        border: 1px solid rgba(242, 169, 0, 0.15) !important;
        color: var(--text-light) !important;
        box-shadow: 0 15px 35px rgba(0,0,0,0.4) !important;
    }
    
    .image-section {
        background: linear-gradient(135deg, #3c2415 0%, #251610 100%) !important;
    }
    
    .info-section {
        color: var(--text-light) !important;
    }
    
    .pd-title {
        color: var(--text-light) !important;
    }
    
    .pd-desc {
        color: var(--text-muted-light) !important;
    }
    
    .pd-price {
        color: var(--bk-orange) !important;
    }
    
    .option-title {
        color: var(--bk-orange) !important;
    }
    
    .pill {
        border-color: var(--bk-brown) !important;
        color: var(--text-muted-light) !important;
    }
    
    .pill:hover {
        border-color: var(--bk-orange) !important;
        color: var(--bk-orange) !important;
    }
    
    .pill.active {
        background: linear-gradient(135deg, var(--bk-red) 0%, var(--bk-orange) 100%) !important;
        color: white !important;
        box-shadow: 0 4px 10px rgba(214, 35, 0, 0.3) !important;
        border-color: transparent !important;
    }
    
    .qty-btn {
        background: var(--bk-brown) !important;
        color: var(--text-light) !important;
    }
    
    .qty-btn:hover {
        background: var(--bk-red) !important;
        color: white !important;
    }
    
    .qty-input {
        border-color: var(--bk-brown) !important;
        background: #170d0a !important;
        color: var(--text-light) !important;
    }
    
    .btn-add-cart {
        background: linear-gradient(135deg, var(--bk-red) 0%, #ff6f00 100%) !important;
        box-shadow: 0 10px 20px rgba(214, 35, 0, 0.3) !important;
    }
    
    .btn-add-cart:hover {
        box-shadow: 0 15px 25px rgba(214, 35, 0, 0.4) !important;
        transform: translateY(-3px) !important;
    }
    
    .breadcrumb, .breadcrumb a {
        color: var(--text-muted-light) !important;
    }
    
    /* Cart / Checkout Overrides */
    .card, .list-card, .table-card {
        background-color: #251610 !important;
        border: 1px solid rgba(242, 169, 0, 0.15) !important;
        color: var(--text-light) !important;
        box-shadow: 0 8px 30px rgba(0,0,0,0.3) !important;
    }
    
    .cart-item {
        background-color: #1c0f0a !important;
        border: 1px solid rgba(242, 169, 0, 0.08) !important;
        color: var(--text-light) !important;
    }
    
    .trash-btn {
        color: #ff6b6b !important;
        background: transparent !important;
        border: none !important;
    }
    
    .btn-checkout, .btn-primary, .btn-gradient, .btn-login, .btn-signup {
        background: linear-gradient(135deg, var(--bk-red) 0%, #ff6f00 100%) !important;
        border: none !important;
        color: white !important;
        box-shadow: 0 4px 15px rgba(214, 35, 0, 0.3) !important;
    }
    
    .btn-checkout:hover, .btn-primary:hover, .btn-gradient:hover {
        background: linear-gradient(135deg, #b31c00 0%, #e65100 100%) !important;
        color: white !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 8px 20px rgba(214, 35, 0, 0.4) !important;
    }
    
    .text-primary, .fs-5.text-primary, #subtotal, #final-total {
        color: var(--bk-orange) !important;
    }
    
    /* Leaderboard / Ranking */
    .leaderboard-header h1 {
        color: var(--bk-orange) !important;
    }
    
    .leaderboard-header p {
        color: var(--text-muted-light) !important;
    }
    
    .rank-card {
        background-color: #251610 !important;
        border: 1px solid rgba(242, 169, 0, 0.15) !important;
        color: var(--text-light) !important;
    }
    
    .rank-name {
        color: var(--text-light) !important;
    }
    
    .rank-desc {
        color: var(--text-muted-light) !important;
    }
    
    .rank-price {
        color: var(--bk-orange) !important;
    }
    
    .btn-rank.btn-cart {
        background: linear-gradient(135deg, var(--bk-red) 0%, #ff6f00 100%) !important;
        color: white !important;
    }
    
    .btn-rank.btn-more {
        border-color: var(--bk-orange) !important;
        color: var(--bk-orange) !important;
        background: transparent !important;
    }
    
    .btn-rank.btn-more:hover {
        background: rgba(242, 169, 0, 0.1) !important;
        color: white !important;
    }
    
    /* Database Demo / Dashboard Panel */
    .page-title {
        color: var(--bk-orange) !important;
    }
    
    .page-subtitle {
        color: var(--text-muted-light) !important;
    }
    
    .kpi-card {
        background-color: #251610 !important;
        border: 1px solid rgba(242, 169, 0, 0.15) !important;
        color: var(--text-light) !important;
    }
    
    .kpi-card h3 {
        color: var(--text-muted-light) !important;
    }
    
    .kpi-value {
        color: var(--text-light) !important;
    }
    
    .table-responsive {
        border-color: rgba(242, 169, 0, 0.1) !important;
    }
    
    .table {
        color: var(--text-light) !important;
    }
    
    .table th {
        background-color: rgba(60, 36, 21, 0.6) !important;
        color: var(--bk-orange) !important;
    }
    
    .table td {
        border-bottom-color: rgba(242, 169, 0, 0.1) !important;
        color: var(--text-light) !important;
    }
    
    .table tbody tr:hover {
        background-color: rgba(242, 169, 0, 0.05) !important;
    }
    
    .pwd-input {
        background: #170d0a !important;
        border-color: var(--bk-brown) !important;
        color: var(--text-light) !important;
    }
    
    /* Dialog / Alerts */
    .toast-container .toast {
        background-color: #251610 !important;
        border-color: var(--bk-orange) !important;
        color: var(--text-light) !important;
    }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="image/logo.jpeg" alt="Logo"> 漢堡王 Burger King
            </a>
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn btn-outline-dark rounded-pill px-4"><i class="fa-solid fa-house"></i> 回首頁</a>
                <button id="btn-logout" class="btn btn-outline-danger rounded-pill px-4 ms-3" style="display:none;">登出</button>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center">
        <div class="profile-container w-100">
            <div class="profile-header">
                <i class="fa-solid fa-circle-user profile-icon"></i>
                <h2 style="color: #2F4F4F; font-weight: 800;">會員中心</h2>
                <p class="text-muted">管理您的帳號與密碼</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">登入信箱 (Email)</label>
                <input type="text" id="user-email" class="form-control" disabled value="讀取中...">
            </div>

            <hr class="my-4">
            <h4 style="color: #2F4F4F; font-weight: 700; margin-bottom: 20px;">修改密碼</h4>

            <div class="form-group">
                <label class="form-label">新密碼</label>
                <input type="password" id="new-password" class="form-control" placeholder="請輸入至少 6 位數新密碼">
            </div>

            <button id="btn-update-pwd" class="btn btn-gradient">確認修改密碼</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyC-LcCfcPYCYAQZ7n45YCe6tCY_jb-ygvI", authDomain: "sonicboom-shop.firebaseapp.com", projectId: "sonicboom-shop", storageBucket: "sonicboom-shop.firebasestorage.app", messagingSenderId: "976804831944", appId: "1:976804831944:web:6ede6a95196478bd49bbfd", measurementId: "G-3FEKWL0QXZ" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').value = user.email;
                document.getElementById('btn-logout').style.display = 'inline-block';
            } else {
                alert('您尚未登入，請先登入！');
                window.location.href = 'login.html';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            if(confirm("確定要登出嗎？")) { 
                localStorage.removeItem('burgerking_cart'); 
                signOut(auth).then(() => { window.location.href = 'index.html'; }); 
            }
        });

        document.getElementById('btn-update-pwd').addEventListener('click', () => {
            const user = auth.currentUser;
            const newPwd = document.getElementById('new-password').value;
            
            if(!newPwd || newPwd.length < 6) {
                alert('密碼不得為空，且至少需要 6 個字元。');
                return;
            }

            if(user) {
                const btn = document.getElementById('btn-update-pwd');
                btn.innerText = '修改中...';
                btn.disabled = true;

                updatePassword(user, newPwd).then(() => {
                    alert('密碼修改成功！請重新登入。');
                    signOut(auth).then(() => { window.location.href = 'login.html'; });
                }).catch((error) => {
                    console.error(error);
                    if(error.code === 'auth/requires-recent-login') {
                        alert('基於安全考量，修改密碼需要重新驗證身分，請先登出再重新登入後修改。');
                    } else {
                        alert('修改失敗，請稍後再試。');
                    }
                    btn.innerText = '確認修改密碼';
                    btn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
