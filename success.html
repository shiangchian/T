<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作成功 - 得正 3C</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans TC', sans-serif;
            /* 與 login.html 相同的漸層背景 */
            background: radial-gradient(circle at 10% 20%, #1C2B5A 0%, #0F1836 100%);
            overflow-y: auto;
            padding: 40px 0;
        }

        /* 背景漂浮物特效 */
        .background-pattern { position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.1; background-image: radial-gradient(circle at 20% 80%, #ffffff 0%, transparent 50%), radial-gradient(circle at 80% 20%, #ffffff 0%, transparent 50%); z-index: 0; }
        .floating-element { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.15); animation: float 6s ease-in-out infinite; z-index: 0; }
        .floating-element:nth-child(1) { width: 120px; height: 120px; top: 15%; left: 15%; animation-delay: 0s; }
        .floating-element:nth-child(2) { width: 80px; height: 80px; top: 65%; right: 10%; animation-delay: 2s; }
        .floating-element:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 25%; animation-delay: 4s; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }

        /* 毛玻璃外層卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            z-index: 1;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* 教授要求的紅框區塊 (質感升級版) */
        .professor-box {
            border: 3px solid #FF4757; /* 鮮豔的紅色邊框 */
            background: #ffffff;
            border-radius: 20px;
            padding: 50px 30px 40px 30px;
            position: relative;
            box-shadow: inset 0 0 20px rgba(255, 71, 87, 0.05);
        }

        /* 頂部打勾圖示 */
        .success-icon {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 50%;
            color: #2ED573;
            font-size: 70px;
            text-shadow: 0 10px 20px rgba(46, 213, 115, 0.3);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s backwards;
        }
        @keyframes popIn { 0% { transform: translateX(-50%) scale(0); } 100% { transform: translateX(-50%) scale(1); } }

        /* 教授要求的：綠字標題 */
        .msg-title {
            color: #2ED573;
            font-size: 38px;
            font-weight: 900;
            margin: 10px 0 15px 0;
            letter-spacing: 2px;
        }

        /* 教授要求的：紅字副標題 */
        .msg-welcome {
            color: #FF4757;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 35px 0;
        }

        /* 教授要求的：黑框雙按鈕 (圓角膠囊美化版) */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-custom {
            border: 2px solid #1C2B5A; /* 得正深藍外框 */
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #1C2B5A;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 左邊藍色系按鈕 */
        .btn-home { background: rgba(28, 43, 90, 0.05); }
        .btn-home:hover {
            background: #1C2B5A; color: white; border-color: #1C2B5A;
            transform: translateY(-3px); box-shadow: 0 10px 20px rgba(28, 43, 90, 0.3);
        }

        /* 右邊金色系按鈕 */
        .btn-action { background: rgba(197, 168, 128, 0.1); }
        .btn-action:hover {
            background: #C5A880; color: white; border-color: #C5A880;
            transform: translateY(-3px); box-shadow: 0 10px 20px rgba(197, 168, 128, 0.3);
        }

        /* 倒數計時文字 */
        .timer-text {
            margin-top: 25px;
            color: #888;
            font-size: 15px;
            font-weight: 500;
        }
        .timer-text span {
            color: #C5A880;
            font-size: 22px;
            font-weight: 900;
            margin: 0 5px;
        }

        /* 購買明細收據樣式 */
        .receipt-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(70, 130, 180, 0.15);
            border-radius: 18px;
            padding: 24px;
            margin: 25px auto;
            text-align: left;
            box-shadow: 0 10px 25px rgba(70, 130, 180, 0.05);
            max-width: 500px;
        }
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .receipt-title {
            font-size: 18px;
            font-weight: 800;
            color: #2F4F4F;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .receipt-badge {
            background: linear-gradient(135deg, #FF4757 0%, #ff6b81 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 8px rgba(255, 71, 87, 0.2);
        }
        .receipt-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .receipt-info-label {
            color: #64748b;
            font-weight: 600;
        }
        .receipt-info-value {
            color: #1e293b;
            font-weight: 700;
            word-break: break-all;
            max-width: 65%;
            text-align: right;
        }
        .receipt-items-list {
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        /* 美化收據內滾動條 */
        .receipt-items-list::-webkit-scrollbar {
            width: 4px;
        }
        .receipt-items-list::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .receipt-items-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .receipt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            gap: 10px;
        }
        .receipt-item:last-child {
            margin-bottom: 0;
        }
        .receipt-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }
        .receipt-item-img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .receipt-item-text {
            display: flex;
            flex-direction: column;
        }
        .receipt-item-name {
            color: #334155;
            font-weight: 700;
            font-size: 14px;
        }
        .receipt-item-spec {
            color: #64748b;
            font-size: 11px;
            margin-top: 2px;
        }
        .receipt-item-qty {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
            margin-left: 6px;
        }
        .receipt-item-price {
            color: #e74c3c;
            font-weight: 700;
            white-space: nowrap;
        }
        .receipt-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            font-size: 18px;
            font-weight: 900;
            color: #FF4757;
        }

        @media (max-width: 600px) {
            .glass-card { padding: 45px 15px 20px 15px; }
            .professor-box { padding: 30px 12px 20px 12px; }
            .success-icon { font-size: 50px; top: -30px; }
            .msg-title { font-size: 26px; margin: 5px 0 10px 0; }
            .msg-welcome { font-size: 16px; margin: 0 0 15px 0; }
            .btn-group { flex-direction: row; gap: 10px; justify-content: center; }
            .btn-custom { padding: 10px 18px; font-size: 14px; gap: 6px; }
            .receipt-card { padding: 14px; margin: 15px auto; border-radius: 12px; }
            .receipt-header { padding-bottom: 8px; margin-bottom: 10px; }
            .receipt-title { font-size: 15px; }
            .receipt-badge { font-size: 11px; padding: 2px 8px; }
            .receipt-info-row { margin-bottom: 6px; font-size: 13px; }
            .receipt-items-list { padding: 8px 0; margin: 10px 0; max-height: 130px; }
            .receipt-item { margin-bottom: 8px; }
            .receipt-item-img { width: 36px; height: 36px; border-radius: 6px; }
            .receipt-item-name { font-size: 13px; }
            .receipt-item-spec { font-size: 10px; }
            .receipt-item-qty { font-size: 11px; }
            .receipt-item-price { font-size: 13px; }
            .receipt-total-row { font-size: 16px; margin-top: 10px; }
        }
    </style>
</head>
<body>

            "fruit11": { name: "Xiaomi 智慧攝影機 C400", price: 1095, img: "https://images.unsplash.com/photo-1558002038-1055907df827?w=500&auto=format&fit=crop&q=60" },
            "fruit12": { name: "Dyson V15 Detect", price: 24900, img: "https://images.unsplash.com/photo-1558317374-067fb5f30001?w=500&auto=format&fit=crop&q=60" }
        };

        function parseOrderItem(itemStr) {
            let name = '';
            let code = '';
            let specs = '';
            let qty = 1;

            const lastX = itemStr.lastIndexOf(' x');
            let baseStr = itemStr;
            if (lastX !== -1) {
                baseStr = itemStr.substring(0, lastX).trim();
                qty = parseInt(itemStr.substring(lastX + 2).trim(), 10) || 1;
            }

            const parenMatch = baseStr.match(/\(([^)]+)\)/);
            if (parenMatch) {
                name = baseStr.replace(/\s*\([^)]+\)/g, '').trim();
                const inner = parenMatch[1];
                const parts = inner.split('/');
                code = parts[0];
                if (parts.length > 1) {
                    specs = parts.slice(1).join(' / ');
                }
            } else {
                name = baseStr;
            }

            return { name, code, specs, qty };
        }

        function findProductDetails(name) {
            for (const key in productsDB) {
                if (productsDB[key].name === name) {
                    return productsDB[key];
                }
            }
            return null;
        }

        // 抓取網址參數
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const name = params.get('name') || '薛翔謙';

        const titleEl = document.getElementById('display-title');
        const welcomeEl = document.getElementById('display-welcome');
        const actionLink = document.getElementById('action-link');

        // 根據來源變更顯示內容
        if (type === 'login') {
            titleEl.innerText = "會員登入成功";
            welcomeEl.innerHTML = `歡迎 <span style="color:#1C2B5A;">${name}</span> 回來`;
            actionLink.innerHTML = `<i class="fa-solid fa-cart-shopping"></i> 前往購物車`;
            actionLink.href = "cart.html";
        } else if (type === 'checkout') {
            titleEl.innerText = "訂單交易成功";
            welcomeEl.innerHTML = `感謝 <span style="color:#1C2B5A;">${name}</span> 的購買`;
            actionLink.innerHTML = `<i class="fa-solid fa-file-invoice"></i> 查看我的訂單`;
            actionLink.href = "profile.html";

            // 讀取訂單資訊
            const orderId = params.get('orderId');
            const orders = JSON.parse(localStorage.getItem('dejeng3c_orders')) || [];
            let order = null;
            if (orderId) {
                order = orders.find(o => o.orderId === orderId);
            }
            if (!order && orders.length > 0) {
                order = orders[orders.length - 1];
            }

            if (order) {
                const receiptContainer = document.getElementById('receipt-container');
                receiptContainer.style.display = 'block';

                let itemsHtml = '';
                const statusSettings = JSON.parse(localStorage.getItem('dejeng3c_product_settings')) || {};

                order.items.forEach(itemStr => {
                    const parsed = parseOrderItem(itemStr);
                    const p = findProductDetails(parsed.name);
                    
                    const img = p ? p.img : 'image/logo.jpeg';
                    let unitPrice = p ? p.price : 0;
                    if (p) {
                        const promoPrice = statusSettings[p.name]?.promoPrice;
                        if (promoPrice && promoPrice < p.price) {
                            unitPrice = promoPrice;
                        }
                    }
                    const subtotal = unitPrice * parsed.qty;

                    itemsHtml += `
                        <div class="receipt-item">
                            <div class="receipt-item-info">
                                <img src="${img}" alt="${parsed.name}" class="receipt-item-img">
                                <div class="receipt-item-text">
                                    <span class="receipt-item-name">${parsed.name}</span>
                                    ${parsed.specs ? `<span class="receipt-item-spec">${parsed.specs}</span>` : ''}
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span class="receipt-item-qty">x${parsed.qty}</span>
                                <span class="receipt-item-price">$${subtotal.toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                });

                const paymentMethodText = order.paymentMethod || '線上付款';
                let paymentIconClass = 'fa-solid fa-credit-card';
                if (paymentMethodText === '貨到付款') {
                    paymentIconClass = 'fa-solid fa-truck-ramp-box';
                } else if (paymentMethodText === 'Line Pay') {
                    paymentIconClass = 'fa-brands fa-line';
                }

                receiptContainer.innerHTML = `
                    <div class="receipt-card">
                        <div class="receipt-header">
                            <div class="receipt-title">
                                <i class="fa-solid fa-receipt" style="color:#C5A880;"></i>
                                <span>購買明細</span>
                            </div>
                            <span class="receipt-badge">已付款</span>
                        </div>
                        <div class="receipt-info-row">
                            <span class="receipt-info-label">訂單編號</span>
                            <span class="receipt-info-value">${order.orderId || '無'}</span>
                        </div>
                        <div class="receipt-info-row">
                            <span class="receipt-info-label">付款方式</span>
                            <span class="receipt-info-value">
                                <i class="${paymentIconClass} me-1" style="${paymentMethodText === 'Line Pay' ? 'color:#06c755;' : ''}"></i>${paymentMethodText}
                            </span>
                        </div>
                        
                        <div class="receipt-items-list">
                            ${itemsHtml}
                        </div>

                        ${order.discount > 0 ? `
                        <div class="receipt-info-row" style="margin-top: 10px;">
                            <span class="receipt-info-label">折扣折抵</span>
                            <span class="receipt-info-value text-success">-$${order.discount.toLocaleString()}</span>
                        </div>
                        ` : ''}

                        <div class="receipt-total-row">
                            <span>付款金額</span>
                            <span>$${order.total.toLocaleString()}</span>
                        </div>
                    </div>
                `;
            }
        } else {
            titleEl.innerText = "會員註冊成功";
            welcomeEl.innerHTML = `歡迎 <span style="color:#1C2B5A;">${name}</span> 成為會員`;
            actionLink.innerHTML = `<i class="fa-solid fa-arrow-right-to-bracket"></i> 點選立即登入`;
            actionLink.href = "login.html";
        }

        // 自動跳轉倒數邏輯
        if (type !== 'checkout') {
            let count = 5;
            const secEl = document.getElementById('sec');
            const timer = setInterval(() => {
                count--;
                secEl.innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.href = "index.html";
                }
            }, 1000);
        } else {
            document.getElementById('timer-container').style.display = 'none';
        }
    </script>
</body>
</html>
